[project]
name = "ipc-classifier-api"
version = "0.1.0"
description = "Abstract-to-IPC classification: hybrid retrieval, reranking, evidence, calibrated confidence."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.3",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
ipc = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
python-preference = "only-system"
# Windows Application Control on the dev machine blocks SQLAlchemy's compiled Cython modules
# (ImportError: DLL load failed ... _row_cy). Build SQLAlchemy from source without C extensions;
# it ships identical pure-Python implementations of those modules.
no-binary-package = ["sqlalchemy"]

[tool.uv.extra-build-variables]
sqlalchemy = { DISABLE_SQLALCHEMY_CEXT = "1" }

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines tolerated; ruff format is not enforced

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the local docker PostgreSQL+pgvector database (IPC_DB_TARGET=local)",
    "ml: requires downloaded models",
]
